# conda 环境定义（走清华镜像，统一管理）
# 创建：conda env create -f environment.yml
# 已在 ~/.condarc 配置清华源更佳，见 scripts/setup_env.sh
name: stock-predict
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
dependencies:
  - python=3.10
  - pip>=24
  - numpy>=1.24,<2
  - pandas>=2.0,<3
  - scipy>=1.10
  - scikit-learn>=1.3
  - pyarrow>=14
  - requests>=2.31
  - lxml>=5.0
  - tqdm>=4.66
  - pip:
      # Qlib / 模型
      - pyqlib>=0.9.6
      - lightgbm>=4.0,<5
      - shap>=0.44
      # 数据
      - akshare>=1.12
      - yfinance>=0.2.40
      # 存储 / 分析
      - duckdb>=0.10
      - sqlalchemy>=2.0
      # 配置 / CLI / 报告
      - pyyaml>=6.0
      - typer>=0.12
      - rich>=13
      - jinja2>=3.1
      - python-dateutil>=2.9
