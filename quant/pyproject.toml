[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-predict"
version = "0.1.0"
description = "AI 辅助量化投资研究系统（Qlib + LightGBM，覆盖 A股/港股/美股）"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [{ name = "stock-predict" }]
keywords = ["quant", "qlib", "lightgbm", "alpha", "backtest"]

dependencies = [
    # 量化核心
    "pyqlib>=0.9.6",
    "lightgbm>=4.0,<5",
    # 数据
    "akshare>=1.12",
    "yfinance>=0.2.40",
    "pandas>=2.0,<3",
    "numpy>=1.24,<2",
    "pyarrow>=14",
    "duckdb>=0.10",
    # 元数据 / 仓库
    "sqlalchemy>=2.0",
    # 特征 / 模型评估
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "shap>=0.44",
    # 配置与 CLI
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "jinja2>=3.1",
    # 通用
    "requests>=2.31",
    "lxml>=5.0",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Phase 2: 新闻 / LLM / 向量
news = [
    "feedparser>=6.0",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "openai>=1.30",
]
# Phase 3: Agent / Web
agent = [
    "langchain>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
stock-predict = "stock_predict.cli:app"

[tool.setuptools.packages.find]
include = ["stock_predict*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
