# ModelScope 创空间配置：A股+港股，数据/模型全部放 /mnt/workspace（重启不丢）。
# 创空间只持久化 /mnt/workspace；其余路径重启即失。
paths:
  project_root: /mnt/workspace
  raw_dir: /mnt/workspace/data/raw
  qlib_dir: /mnt/workspace/data/qlib_data
  warehouse_dir: /mnt/workspace/data/warehouse
  sqlite_path: /mnt/workspace/data/meta.db
  output_dir: /mnt/workspace/data/output

universe:
  config_file: config/universe.yaml            # 相对 quant 包根
  markets: [cn, hk]                       # ★A股+港股（ModelScope 在国内，AKShare 可用，决不触发 yfinance 美股）
  demo_mode: false

data:
  synthetic: false
  incremental: true                       # 增量采集：重启后只补最新日
  years_back: 6
  sources: {cn: akshare, hk: akshare, us: yfinance}

feature:
  use_alpha158: true
  use_qlib_alpha: false
  label_horizon: 20
  process: rank
  neutralize: true
  valuation: true
  quality: true
  industry: false
  northbound: true                        # 北向资金因子（A股 alpha）
  news: false

model:
  name: lightgbm
  ensemble: true
  calibrate: false                        # 关校准：保留概率区分度
  lightgbm: {objective: binary, n_estimators: 500, learning_rate: 0.02, num_leaves: 64,
             max_depth: -1, min_child_samples: 80, subsample: 0.8, colsample_bytree: 0.8,
             reg_alpha: 0.1, reg_lambda: 1.0, random_state: 42}
  split: {train_end: "2022-12-31", valid_start: "2023-01-01", valid_end: "2023-12-31",
          test_start: "2024-01-01", test_end: ""}

backtest:
  top_n: 20
  hold_days: 20
  commission_bps: 3.0
  slippage_bps: 5.0
  impact_coef: 10.0
  weighting: inv_vol
  max_weight: 0.10
  max_industry: 0.40
  ranking: abs                            # A股(+北向) 实测 abs 最优
  benchmark: "^HS300"

report:
  top_k: 0                               # 0=全部列出
  min_probability: 0.0
  out_path: /mnt/workspace/data/output/recommendations_cn.md
  explain_method: shap

news:
  enabled: true
  sources: [akshare, rss]
  rss_feeds: ["https://www.cnbc.com/id/100003114/device/rss/rss.html"]
  dedup: true
  max_codes: 20
  per_stock: 3

embedding: {model_path: "", dim: 1024, index_path: /mnt/workspace/data/output/news.faiss}
llm:
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key: ""                             # 走环境变量 ARK_API_KEY
  model: "deepseek-v3-2-251201"
  temperature: 0.1
  timeout: 180
