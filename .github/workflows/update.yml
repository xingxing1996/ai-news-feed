name: Update AI Feed

# 每 2 小时跑一次：RSS → Ark LLM 评分/摘要 → feed.json（与量化推荐互不相关）
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */2 * * *'   # 每 2 小时（UTC）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run crawler and AI script
      env:
        ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      run: python main.py

    - name: Commit feed.json + logs
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git fetch origin main
        git reset origin/main
        git add feed.json feedLastTime.json logs/ || true
        git commit -m "Auto-update feed.json (every 2h)" || exit 0
        git push
