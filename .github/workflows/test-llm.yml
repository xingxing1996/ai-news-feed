name: Test LLM Call

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install deps
      run: pip install openai pyyaml -q
    - name: Test Ark chat completion
      env:
        ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      run: |
        python - <<'PY'
        import os, json
        from openai import OpenAI
        from pathlib import Path
        import sys
        sys.path.insert(0, '.')
        from common.models import get_model_pool
        key = os.getenv("ARK_API_KEY")
        print("key set:", bool(key))
        if not key:
            print("RESULT: NO_KEY"); raise SystemExit(1)
        pool = get_model_pool()
        base = "https://ark.cn-beijing.volces.com/api/v3"
        client = OpenAI(base_url=base, api_key=key, max_retries=0)
        for m in pool:
            try:
                resp = client.chat.completions.create(
                    model=m, timeout=180,
                    messages=[{"role": "user", "content": "只回复：ok"}],
                    max_tokens=10,
                )
                print("MODEL", m, "->", repr(resp.choices[0].message.content))
            except Exception as e:
                print("MODEL", m, "FAIL:", str(e)[:300])
        print("RESULT: DONE")
        PY
