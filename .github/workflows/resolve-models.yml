name: Resolve Model Versions

# 每天：查 Ark /models，把 config/models.yaml 里逻辑名的最新版本写回 resolved。
# 模型一更新/下线，第二天自动落到配置，无需手动改版本号。
on:
  schedule:
    - cron: '17 1 * * *'   # 每天 01:17 UTC
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install pyyaml
    - name: Resolve latest model versions
      env:
        ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
      run: python resolve_models.py
    - name: Commit models.yaml + logs
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git fetch origin main && git reset origin/main
        git add config/models.yaml logs/ || true
        git commit -m "Auto-resolve model versions" || exit 0
        git push
