name: Sync to ModelScope

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-modelscope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push Code to ModelScope Studio
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config lfs.allowincompletepush true
          git remote add modelscope https://oauth2:ms-d9c034d8-4f01-43c9-b3eb-12cb35d4b075@www.modelscope.cn/studios/gaoxingxing12415/test_stock_predict.git || true
          
          # 创建不带任何 LFS 缓存历史指针的极速分支推送给 ModelScope
          git checkout -b release-ms
          git rm -rf --cached quant/state/*.parquet 2>/dev/null || true
          git commit -m "clean lfs sync" || true
          git push -f modelscope release-ms:master
